<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3-in-1 Cleanliness Assessment System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                50: 'var(--color-primary-50)',
                100: 'var(--color-primary-100)',
                500: 'var(--color-primary-500)',
                600: 'var(--color-primary-600)',
                700: 'var(--color-primary-700)',
              }
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-primary-50: #eef2ff;
        --color-primary-100: #e0e7ff;
        --color-primary-500: #6366f1;
        --color-primary-600: #4f46e5;
        --color-primary-700: #4338ca;
        --header-start: #1E1B4B;
        --header-mid: #312E81;
        --header-end: #4C1D95;
      }

      /* Theme: Blue */
      .theme-blue {
        --color-primary-50: #eff6ff;
        --color-primary-100: #dbeafe;
        --color-primary-500: #3b82f6;
        --color-primary-600: #2563eb;
        --color-primary-700: #1d4ed8;
        --header-start: #172554;
        --header-mid: #1e3a8a;
        --header-end: #1e40af;
      }

      /* Theme: Emerald */
      .theme-emerald {
        --color-primary-50: #ecfdf5;
        --color-primary-100: #d1fae5;
        --color-primary-500: #10b981;
        --color-primary-600: #059669;
        --color-primary-700: #047857;
        --header-start: #022c22;
        --header-mid: #064e3b;
        --header-end: #065f46;
      }

      /* Theme: Rose */
      .theme-rose {
        --color-primary-50: #fff1f2;
        --color-primary-100: #ffe4e6;
        --color-primary-500: #f43f5e;
        --color-primary-600: #e11d48;
        --color-primary-700: #be123c;
        --header-start: #4c0519;
        --header-mid: #881337;
        --header-end: #9f1239;
      }

      body {
        box-sizing: border-box;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      
      * {
        box-sizing: border-box;
      }
      
      .sidebar-item {
        transition: all 0.2s ease;
      }
      
      .sidebar-item:hover {
        background: var(--color-primary-50);
      }
      
      .sidebar-item.active {
        background: linear-gradient(135deg, var(--color-primary-500) 0%, var(--color-primary-600) 100%);
        color: white;
      }
      
      .card-hover {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .card-hover:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.15);
      }
      
      .fade-in {
        animation: fadeIn 0.4s ease;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .btn-primary {
        background: linear-gradient(135deg, var(--color-primary-500) 0%, var(--color-primary-600) 100%);
        transition: all 0.2s ease;
      }
      
      .btn-primary:hover {
        background: linear-gradient(135deg, var(--color-primary-600) 0%, var(--color-primary-700) 100%);
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
      }
      
      .btn-primary:active {
        transform: translateY(0);
      }
      
      .gradient-header {
        background: linear-gradient(135deg, var(--header-start) 0%, var(--header-mid) 50%, var(--header-end) 100%);
      }
      
      .image-upload-preview {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        transition: all 0.2s ease;
      }
      
      .image-upload-preview:hover {
        transform: scale(1.02);
      }
      
      .image-upload-preview img {
        width: 100%;
        height: 120px;
        object-fit: cover;
      }
      
      .notification-badge {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--color-primary-500);
        box-shadow: 0 0 0 3px var(--color-primary-100);
      }
      
      .table-row {
        transition: background 0.2s ease;
      }
      
      .table-row:hover {
        background: var(--color-primary-50);
      }
      
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      
      ::-webkit-scrollbar-track {
        background: #F1F5F9;
      }
      
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 4px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: #94A3B8;
      }
      
      .stat-card {
        background: linear-gradient(135deg, #FFFFFF 0%, #F8FAFC 100%);
      }
      
      .role-badge {
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      
      .modal-overlay {
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
      }
      
      .spinner {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 0.6s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Dark Mode Overrides */
      .dark body {
        background-color: #0f172a;
        color: #e2e8f0;
      }

      .dark .bg-white {
        background-color: #1e293b;
      }

      .dark .bg-slate-50 {
        background-color: #0f172a;
      }

      .dark .text-slate-900 {
        color: #f8fafc;
      }

      .dark .text-slate-700 {
        color: #cbd5e1;
      }

      .dark .text-slate-600 {
        color: #94a3b8;
      }
      
      .dark .text-slate-500 {
        color: #64748b;
      }

      .dark .border-slate-100, .dark .border-slate-200 {
        border-color: #334155;
      }

      .dark input, .dark select, .dark textarea {
        background-color: #1e293b;
        border-color: #334155;
        color: #f8fafc;
      }
      
      .dark .table-row:hover {
        background-color: #334155;
      }

      .dark .sidebar-item:hover {
        background-color: rgba(255, 255, 255, 0.1);
      }

      .dark ::-webkit-scrollbar-track {
        background: #1e293b;
      }
      
      .dark ::-webkit-scrollbar-thumb {
        background: #475569;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body class="h-full bg-slate-50 transition-colors duration-200">
    <div id="root" class="h-full overflow-auto"></div>
  </body>
</html>
